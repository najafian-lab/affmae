# --------------------------------------------------------------------------- #
# Experiment Configuration
# --------------------------------------------------------------------------- #

experiment:
  name: "FPW_AFF_BASE_FT_1024_0.4DS_SLITS_PGBMI"
  description: "fine tune code test"
  output_dir: "output" # Base directory for all outputs
  device: "cuda"
  wandb_enabled: false 

# --------------------------------------------------------------------------- #
# Data Configuration
# --------------------------------------------------------------------------- #
data:
  base_path: "${DATA_ROOT:-data}/fpwdata"
  # base_path: "${DATA_ROOT:-data}/fpwdata"
  input_ext: ".tiff"
  in_channels: 1
  indices: [2, 3]
  # indices: [0, 1, 2]
  num_classes: 3 # should be indices + bg class
  img_size: 1024
  batch_size: 8
  num_workers: 3


# --------------------------------------------------------------------------- #
# Model Architecture Parameters 
# --------------------------------------------------------------------------- #
model:
  model_type: "aff" # 'aff' or 'vit'
  pretrained_ckpt_path: "${CHECKPOINT_ROOT:-weights}/pretrain/ckpt_epoch_399_affmae_fpw.pth"
  patch_size: 8
  
  # aff
  aff_embed_dims: [128, 256, 512, 768]
  aff_depths: [3,4,16,2]
  aff_num_heads: [4,8,16,24]
  aff_nbhd_sizes: [64, 64, 64, 64]
  aff_cluster_size: 8
  aff_alpha: 10.0
  aff_global_attention: false
  aff_ds_rates: [0.4, 0.4, 0.4, 0.4]
  aff_mlp_ratio: 3
  aff_merging_method: "cluster"

  decoder_embed_dim: 384
  decoder_depth: 4
  decoder_num_heads: 6
  decoder_use_cls_token: true

  cluster_attention_backend: "auto"
  decoder_deform_backend: "auto"
  decoder_knn_cache: true


# --------------------------------------------------------------------------- #
# Model & Training Configuration
# --------------------------------------------------------------------------- #
train:
  epochs: 400
  weight_decay: 0.0075

  # Learning Rates
  learning_rate: 1.0e-4
  min_lr: 1.0e-6
  warmup_epochs: 25
  layer_decay: 0.6

  # Loss function: 'focal' or 'dice'
  loss_fn: "combo"
  # Class weights for the loss function
  class_weighting: [0.2, 2.0, 3.0] # one per class, background first

  # Evaluation
  start_eval_epoch: 10000
  log_freq: 1
  num_accum: 1
