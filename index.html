<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eee2" />
    <title>AFFMAE</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap');

      :root {
        --paper: #f7f2e6;
        --paper-deep: #e6eee5;
        --ink: #173a34;
        --muted: #526c66;
        --green: #0d5a4f;
        --orange: #b65c42;
        --sans: 'DM Sans', system-ui, sans-serif;
        --serif: 'Newsreader', Georgia, serif;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 8%, rgba(182, 92, 66, 0.11), transparent 24rem),
          linear-gradient(145deg, var(--paper) 0%, #f5f1e7 42%, var(--paper-deep) 100%);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 700px;
        padding: 2rem;
        text-align: center;
      }
      .kicker {
        margin: 0 0 0.9rem;
        color: var(--orange);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: var(--green);
        font-family: var(--serif);
        font-size: clamp(4rem, 13vw, 8rem);
        font-weight: 600;
        letter-spacing: -0.07em;
        line-height: 0.9;
      }
      p.todo {
        margin: 1.75rem 0 0;
        color: var(--muted);
        font-family: var(--serif);
        font-size: clamp(1.25rem, 3vw, 1.75rem);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Najafian Lab</p>
      <h1>AFFMAE</h1>
      <p class="todo">Project page coming soon.</p>
    </main>
  </body>
</html>
